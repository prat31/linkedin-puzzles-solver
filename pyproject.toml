[project]
name = "linpuzs"
dynamic = ["version"]  # from the latest vX.Y.Z git tag, see .github/workflows/release.yml
description = "Solves LinkedIn's daily puzzles (Queens, Tango, Zip, Mini Sudoku, Patches) on your Android phone over ADB."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Pratyush" }]
requires-python = ">=3.10"
keywords = ["linkedin", "puzzle", "solver", "queens", "tango", "zip", "sudoku", "adb", "android", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Puzzle Games",
]
dependencies = [
    "rich>=13.7",
    "questionary>=2.0",
    "prompt_toolkit>=3.0",
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.urls]
Homepage = "https://github.com/prat31/linpuzs"
Source = "https://github.com/prat31/linpuzs"
Issues = "https://github.com/prat31/linpuzs/issues"
Releases = "https://github.com/prat31/linpuzs/releases"

[project.scripts]
linpuzs = "linpuzs.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/linpuzs"]

[tool.hatch.build.targets.sdist]
# Demo videos/GIF and the social preview are for GitHub only (the README links the GIF from GitHub).
exclude = ["media/*.mov", "media/*.mp4", "media/*.gif", "media/social-preview.png"]
