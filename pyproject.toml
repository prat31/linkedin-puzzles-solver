[project]
name = "linpuzs"
dynamic = ["version"]  # from the latest vX.Y.Z git tag, see .github/workflows/release.yml
description = "LinkedIn puzzle solver: screenshots your phone over ADB, solves the daily game, and taps in the answer."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "rich>=13.7",
    "questionary>=2.0",
    "pillow>=10.0",
    "numpy>=1.26",
]

[project.scripts]
linpuzs = "linpuzs.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src/linpuzs"]
