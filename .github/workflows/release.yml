# Every push to main publishes a new minor version to PyPI: v0.1.0, v0.2.0, v0.3.0, ...
#
# The version lives only in git tags (hatch-vcs reads it at build time), so
# nothing is committed back to main. Uploads use PyPI trusted publishing, which
# must be configured on pypi.org for this repo, this file (release.yml) and the
# "pypi" environment.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # push the tag and create the GitHub release
      id-token: write # trusted publishing to PyPI
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the latest version

      - uses: astral-sh/setup-uv@v6

      - name: Test
        run: |
          uv sync
          uv run pytest -q

      - name: Pick the next version
        id: version
        run: |
          # Re-running on an already released commit reuses its tag.
          existing=$(git tag --points-at HEAD --list 'v*' | head -n1)
          if [ -n "$existing" ]; then
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS=. read -r major minor _ <<< "${latest#v}"
            next="v${major}.$((minor + 1)).0"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $next (previous: ${latest:-none})"

      - name: Build
        run: |
          git tag "${{ steps.version.outputs.tag }}" 2>/dev/null || true
          rm -rf dist
          uv build
          ls dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Push tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git push origin "$TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" dist/* --generate-notes

  # Updates Formula/linpuzs.rb in prat31/homebrew-tap for the version just
  # published. Pushes with the deploy key stored in the HOMEBREW_TAP_KEY secret.
  homebrew:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Wait for the release on PyPI
        id: sdist
        run: |
          version="${TAG#v}"
          for _ in $(seq 1 30); do
            if json=$(curl -fsSL "https://pypi.org/pypi/linpuzs/$version/json"); then break; fi
            echo "waiting for linpuzs $version on PyPI..."
            sleep 10
          done
          sdist=$(echo "$json" | jq -c '.urls[] | select(.packagetype == "sdist")')
          echo "url=$(echo "$sdist" | jq -r .url)" >> "$GITHUB_OUTPUT"
          echo "sha256=$(echo "$sdist" | jq -r .digests.sha256)" >> "$GITHUB_OUTPUT"

      - uses: Homebrew/actions/setup-homebrew@main

      - name: Render the formula
        run: |
          brew tap prat31/tap
          formula="$(brew --repository prat31/tap)/Formula/linpuzs.rb"
          mkdir -p "$(dirname "$formula")"
          sed -e 's|@@SDIST_URL@@|${{ steps.sdist.outputs.url }}|' \
              -e 's|@@SDIST_SHA256@@|${{ steps.sdist.outputs.sha256 }}|' \
              packaging/homebrew/linpuzs.rb > "$formula"
          # numpy and pillow come from Homebrew; hatchling/hatch-vcs build the sdist.
          brew update-python-resources --ignore-main-package-cooldown \
            --exclude-packages numpy,pillow --extra-packages hatchling,hatch-vcs \
            prat31/tap/linpuzs
          cat "$formula"

      - name: Test-install the formula
        run: |
          brew install --build-from-source prat31/tap/linpuzs
          brew test prat31/tap/linpuzs

      - name: Push to the tap
        env:
          TAP_KEY: ${{ secrets.HOMEBREW_TAP_KEY }}
        run: |
          eval "$(ssh-agent -s)"
          echo "$TAP_KEY" | ssh-add -
          cd "$(brew --repository prat31/tap)"
          git remote set-url origin git@github.com:prat31/homebrew-tap.git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/linpuzs.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date"
            exit 0
          fi
          git commit -m "linpuzs ${TAG#v}"
          git push origin HEAD:main
