# Every push to main publishes a new minor version to PyPI: v0.1.0, v0.2.0, v0.3.0, ...
#
# The version lives only in git tags (hatch-vcs reads it at build time), so
# nothing is committed back to main. Uploads use PyPI trusted publishing, which
# must be configured on pypi.org for this repo, this file (release.yml) and the
# "pypi" environment.

name: Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write # push the tag and create the GitHub release
      id-token: write # trusted publishing to PyPI
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags, to find the latest version

      - uses: astral-sh/setup-uv@v6

      - name: Test
        run: |
          uv sync
          uv run pytest -q

      - name: Pick the next version
        id: version
        run: |
          # Re-running on an already released commit reuses its tag.
          existing=$(git tag --points-at HEAD --list 'v*' | head -n1)
          if [ -n "$existing" ]; then
            echo "tag=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          latest=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1)
          if [ -z "$latest" ]; then
            next="v0.1.0"
          else
            IFS=. read -r major minor _ <<< "${latest#v}"
            next="v${major}.$((minor + 1)).0"
          fi
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "Releasing $next (previous: ${latest:-none})"

      - name: Build
        run: |
          git tag "${{ steps.version.outputs.tag }}" 2>/dev/null || true
          rm -rf dist
          uv build
          ls dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Push tag and create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          git push origin "$TAG"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" dist/* --generate-notes
